<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — InvestIQ</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-logo"><span class="auth-logo-mark">I</span><span id="brandName">InvestIQ</span></a>
    <div class="card">
      <h2>Welcome back</h2>
      <p class="text-muted">Log in to continue managing your virtual portfolio.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="input" type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="input-group-btn" id="togglePw" aria-label="Show password">👁</button>
          </div>
        </div>
        <div class="form-error" id="formError" hidden style="margin-bottom:var(--space-3)"></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Log in</button>
      </form>

      <div class="divider"></div>
      <button type="button" class="btn btn-outline btn-block" id="demoLoginBtn">Use demo account</button>
    </div>
    <p class="auth-footer-link">New to InvestIQ? <a href="signup.html" style="color:var(--color-text);font-weight:600">Sign up</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/data/demoStocks.js"></script>
<script src="js/marketData.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById("brandName").textContent = CONFIG.APP_NAME;
  document.title = "Log in — " + CONFIG.APP_NAME;
  if (Store.getSession()) window.location.href = "dashboard.html";

  const form = document.getElementById("loginForm");
  const submitBtn = document.getElementById("submitBtn");
  document.getElementById("togglePw").addEventListener("click", function () {
    const pw = document.getElementById("password");
    pw.type = pw.type === "password" ? "text" : "password";
    this.textContent = pw.type === "password" ? "👁" : "🙈";
  });

  function afterLogin() {
    api.getRiskProfile().then(function (profile) {
      window.location.href = profile ? "dashboard.html" : "onboarding.html";
    });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errEl = document.getElementById("formError");
    errEl.hidden = true;

    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";
    api.login(email, password).then(afterLogin).catch(function (err) {
      errEl.textContent = err.message;
      errEl.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = "Log in";
    });
  });

  // Demo account: creates (or reuses) a seeded demo user so reviewers can
  // explore the app without signing up. Demo-mode convenience only.
  document.getElementById("demoLoginBtn").addEventListener("click", function () {
    const demoEmail = "demo@investiq.app";
    const demoPassword = "demo123";
    api.login(demoEmail, demoPassword).then(afterLogin).catch(function () {
      api.signup("Demo Investor", demoEmail, demoPassword).then(function () {
        window.location.href = "onboarding.html";
      });
    });
  });
</script>
</body>
</html>
