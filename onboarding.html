<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investor Onboarding — InvestIQ</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/onboarding.css">
</head>
<body>
<div class="onboarding-shell">
  <div class="onboarding-card">
    <div class="row-between" style="margin-bottom:var(--space-4)">
      <a href="index.html" style="font-weight:800" id="brandName">InvestIQ</a>
      <span class="text-muted" id="stepCounter">Step 1 of 6</span>
    </div>
    <div class="progress-steps" id="progressSteps"></div>

    <div class="card">
      <form id="onboardingForm">
        <div id="stepsContainer"></div>
        <div class="form-error" id="stepError" hidden></div>
        <div class="onboarding-nav">
          <button type="button" class="btn btn-outline" id="backBtn">Back</button>
          <button type="button" class="btn btn-primary" id="nextBtn">Continue</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/data/demoStocks.js"></script>
<script src="js/marketData.js"></script>
<script src="js/riskEngine.js"></script>
<script src="js/api.js"></script>
<script src="js/pages/onboarding.js"></script>
</body>
</html>
