<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stocks — InvestIQ</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/stocks.css">
</head>
<body>
<div id="appShell" data-page="stocks">
  <div id="pageContent">
    <div class="section-header">
      <div>
        <h2>Indian Stocks</h2>
        <p class="text-muted" style="margin:0">Browse the NSE demo universe. <span class="demo-flag">Demo Data</span></p>
      </div>
    </div>

    <div class="filter-bar card" style="padding:var(--space-4)">
      <input type="search" class="input" id="searchInput" placeholder="Search by name or symbol (e.g. TCS)">
      <select class="select" id="sectorFilter"></select>
      <select class="select" id="riskFilter">
        <option value="All">All Risk Levels</option>
        <option value="Low">Low Risk</option>
        <option value="Moderate">Moderate Risk</option>
        <option value="High">High Risk</option>
      </select>
      <select class="select" id="capFilter">
        <option value="All">All Market Caps</option>
        <option value="Large">Large Cap (₹2L Cr+)</option>
        <option value="Mid">Mid Cap (₹50k-2L Cr)</option>
        <option value="Small">Small Cap (&lt;₹50k Cr)</option>
      </select>
      <select class="select" id="sortSelect">
        <option value="score">Sort: Score (High to Low)</option>
        <option value="price">Sort: Price (High to Low)</option>
        <option value="growth">Sort: Growth (High to Low)</option>
        <option value="valuation">Sort: Valuation (Best First)</option>
      </select>
    </div>

    <div class="card card-flush">
      <div class="table-wrap">
        <table class="data-table" id="stocksTable">
          <thead>
            <tr>
              <th>Company</th><th>Price</th><th>Day Change</th><th>Score</th><th>Sector</th><th>Risk</th><th>P/E</th>
            </tr>
          </thead>
          <tbody id="stocksTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/data/demoStocks.js"></script>
<script src="js/data/demoHistorical.js"></script>
<script src="js/marketData.js"></script>
<script src="js/riskEngine.js"></script>
<script src="js/scoringEngine.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/pages/stocks.js"></script>
</body>
</html>
